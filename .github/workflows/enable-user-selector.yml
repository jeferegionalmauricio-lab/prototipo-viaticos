name: Enable User Selector

on:
  push:
    paths:
      - '.github/workflows/enable-user-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update index with user selector
        run: |
          python3 <<'PY'
          import re, html
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'const b="([^"]+)";', s)
          if not m:
              raise SystemExit('No se encontró el payload comprimido del prototipo.')
          b=m.group(1)
          users=[('3207','NELSON MARROQUÍN','5831'),('3822','GABRIEL MARTÍNEZ','7246'),('4708','JHONNY JUNIOR CERMEÑO','3918'),('4918','JUAN LAJUJ','8462'),('4004','CESAR PAC','2175'),('4420','MOISÉS CASTILLO','6309'),('4389','TADEO CARRASCOZA','4587'),('3318','CARLOS GIOVANNI LORENZANA ESTRADA','9124'),('4765','MAURICIO ORELLANA','3760')]
          cards=''.join(f'<button class="user" data-code="{c}"><b>{c}</b><span>{html.escape(n)}</span></button>' for c,n,pin in users)
          users_js='{' + ','.join(repr(c)+':'+repr(pin) for c,n,pin in users) + '}'
          wrapper=f'''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidación Comercial</title><style>*{{box-sizing:border-box}}body{{margin:0;background:#0b0d0f;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}}.wrap{{width:390px;min-height:100vh;background:#0b0d0f;padding:22px 16px}}h1{{font-size:19px;text-align:center;margin:8px 0 6px}}.sub{{text-align:center;color:#9aa4ad;font-size:12px;margin-bottom:18px}}.list{{display:grid;gap:9px}}.user{{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #2b3239;border-radius:12px;background:#14181c;color:#f3f5f7;cursor:pointer;text-align:left}}.user b{{width:65px;text-align:center;background:#f4c38f;color:#111;border-radius:7px;padding:10px 5px}}.user span{{font-weight:800;font-size:13px}}.login{{margin-top:18px;padding:18px;background:#14181c;border:1px solid #2b3239;border-radius:14px;display:none}}.login h2{{font-size:16px;margin:0 0 6px}}.login p{{color:#9aa4ad;font-size:12px;margin:0 0 12px}}input{{width:100%;padding:13px;border-radius:9px;border:1px solid #2b3239;background:#0d1114;color:#fff;font-size:20px;letter-spacing:8px;text-align:center}}.btn{{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#e7b83f;color:#111;font-weight:900;cursor:pointer}}.err{{color:#ef8990;font-size:12px;margin-top:8px;min-height:16px}}.loading{{text-align:center;padding:40px;color:#9aa4ad}}</style></head><body><div class="wrap"><h1>LIQUIDACIÓN COMERCIAL</h1><div class="sub">Seleccione su usuario</div><div class="list">{cards}</div><div class="login" id="login"><h2 id="who"></h2><p>Ingrese su contraseña de 4 dígitos</p><input id="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="off"><button class="btn" id="enter">INGRESAR</button><div class="err" id="err"></div></div></div><script>const PAYLOAD={b!r};const users={users_js};let selected=null;document.querySelectorAll('.user').forEach(el=>el.onclick=()=>{{selected=el.dataset.code;document.getElementById('who').textContent=selected+' · '+el.querySelector('span').textContent;document.getElementById('login').style.display='block';document.getElementById('pin').value='';document.getElementById('err').textContent='';document.getElementById('pin').focus()}});async function enter(){{const pin=document.getElementById('pin').value;if(users[selected]!==pin){{document.getElementById('err').textContent='Contraseña incorrecta.';return}}document.querySelector('.wrap').innerHTML='<div class="loading">Conectando con la base de datos...</div>';try{{const raw=atob(PAYLOAD),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();out=out.replace(/VENDEDOR_CODIGO='[^']*'/,`VENDEDOR_CODIGO='${{selected}}'`);out=out.replace(/init\(\);/,`db.auth.signInWithPassword({{email:'${{selected}}@liquidacion.local',password:'${{pin}}'}}).then(()=>init()).catch(e=>{{document.body.innerHTML='<pre style="padding:20px">No se pudo autenticar: '+e.message+'</pre>'}});`);document.open();document.write(out);document.close()}}catch(e){{document.body.innerHTML='<pre style="padding:20px">No se pudo cargar el sistema: '+e.message+'</pre>'}}}}document.getElementById('enter').onclick=enter;document.getElementById('pin').onkeydown=e=>{{if(e.key==='Enter')enter()}};</script></body></html>'''
          p.write_text(wrapper,encoding='utf-8')
          PY
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Agregar selector de usuarios al iniciar'
          git push
