const money=n=>'Q '+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});function fmtDate(v){if(!v)return '';let p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''}function inputDate(v){if(!v)return '';let p=v.split('/');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:''}function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function weekFromDate(v){let d=new Date(v+'T12:00:00');if(isNaN(d))return null;let day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));let s=new Date(d);s.setDate(d.getDate()+5);return{inicio:dateISO(d),fin:dateISO(s)}}function nextWeekFromEnd(v){let d=new Date(v+'T12:00:00');d.setDate(d.getDate()+1);return weekFromDate(dateISO(d))}function weekText(){return semana?`${fmtDate(semana.fecha_inicio)} al ${fmtDate(semana.fecha_fin)}`:'Sin semana activa'}
async function init(){try{let r=await db.from('vendedores').select('*').eq('codigo',VENDEDOR_CODIGO).single();if(r.error)throw r.error;vendedor=r.data;await ensureOpenWeek();await loadData();go('home')}catch(e){content.innerHTML=`<div class="notice"><b>No se pudo conectar a la base de datos.</b><br>${e.message}</div><button class="btn primary" onclick="init()">REINTENTAR</button>`}}async function ensureOpenWeek(){let r=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','ABIERTA').order('fecha_inicio',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(r.data){semana=r.data;return}let w=weekFromDate(dateISO(new Date())),e=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(e.error)throw e.error;if(e.data){let u=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',e.data.id).select().single();if(u.error)throw u.error;semana=u.data;return}let n=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:w.inicio,fecha_fin:w.fin,estado:'ABIERTA'}).select().single();if(n.error)throw n.error;semana=n.data}async function loadData(){let[f,c,h]=await Promise.all([db.from('facturas_viaticos').select('*').eq('semana_id',semana.id).order('fecha_factura').order('created_at'),db.from('cobros_liquidacion').select('*').eq('semana_id',semana.id).order('fecha_pago').order('created_at'),db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','CERRADA').order('fecha_inicio',{ascending:false})]);if(f.error)throw f.error;if(c.error)throw c.error;if(h.error)throw h.error;invoices=f.data||[];cobros=c.data||[];history=h.data||[]}

function home(){content.innerHTML=`<div class="profile"><div class="avatar">V</div><h2>${vendedor?.nombre||'Vendedor'}</h2><div class="muted">Ruta: <b>${vendedor?.ruta||''}</b></div><div class="muted">Código: <b>${vendedor?.codigo||''}</b></div></div><div class="notice"><b>Semana activa:</b><br>${weekText()}<br><small>☁ Datos sincronizados en la nube</small></div><div class="modules"><div class="module" onclick="go('viaticos')"><div class="mi">⛽</div><b>VIÁTICOS</b><small>Registro y liquidación semanal</small></div><div class="module" onclick="go('cobros')"><div class="mi">▣</div><b>COBRO</b><small>Registro y liquidación de cobros</small></div></div>`}function weekCard(){return `<div class="card week"><div class="week-info"><div class="label">SEMANA DE LIQUIDACIÓN</div><div class="value">${weekText()}</div></div><button class="btn outline smallbtn" onclick="openWeekChanger()">✎ CAMBIAR</button></div>`}

tn danger" style="width:100%;margin-top:8px" onclick="confirmDepurar()">▣ DEPURAR</button>`}
function form(){let x=editingId?invoices.find(a=>a.id===editingId):null;x=x||{fecha_factura:'',serie:'',numero:'',razon_social:'',concepto:'COMBUSTIBLE',monto:'',tipo_registro:'VIATICOS SEMANA'};content.innerHTML=`<div class="card"><div class="field"><label>FECHA DE FACTURA *</label><input id="fdate" type="date" value="${inputDate(x.fecha_factura)}"></div><div class="field"><label>SERIE *</label><input id="fserie" value="${x.serie||''}"></div><div class="field"><label>NÚMERO *</label><input id="fnum" value="${x.numero||''}"></div><div class="field"><label>RAZÓN SOCIAL *</label><input id="frazon" value="${x.razon_social||''}"></div><div class="field"><label>CONCEPTO *</label><select id="fconcepto"><option>COMBUSTIBLE</option><option>HOSPEDAJE</option><option>ALIMENTACION</option></select></div><div class="field"><label>MONTO *</label><input id="fmonto" type="number" step="0.01" min="0.01" value="${x.monto||''}"></div><div class="field"><label>TIPO DE REGISTRO *</label><select id="fobs"><option>VIATICOS SEMANA</option><option>DEPRECIACION</option></select></div><button class="btn primary" onclick="saveInvoice()">GUARDAR EN LA NUBE</button></div>`;fconcepto.value=x.concepto;fobs.value=x.tipo_registro}async function saveInvoice(){let x={fecha_factura:fdate.value,serie:fserie.value.trim(),numero:fnum.value.trim(),razon_social:frazon.value.trim(),concepto:fconcepto.value,monto:Number(fmonto.value),tipo_registro:fobs.value,vendedor_id:vendedor.id,semana_id:semana.id};if(!x.fecha_factura||!x.serie||!x.numero||!x.razon_social||!x.monto){alert('Completa los campos obligatorios.');return}let r=editingId?await db.from('facturas_viaticos').update(x).eq('id',editingId):await db.from('facturas_viaticos').insert(x);if(r.error){alert('No se pudo guardar: '+r.error.message);return}await loadData();editingId=null;go('viaticos')}
function menuInvoice(id){let x=invoices.find(a=>a.id===id),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Factura ${x.serie}</h3><p>${x.razon_social}<br>${x.concepto} · ${money(x.monto)}<br>${x.tipo_registro}</p><div class="modal-actions"><button class="btn outline" onclick="editingId='${id}';this.closest('.modal').remove();go('form')">✎ Editar</button><button class="btn danger" onclick="deleteInvoice('${id}');this.closest('.modal').remove()">🗑 Eliminar</button></div></div>`;document.querySelector('.phone').appendChild(m)}async function deleteInvoice(id){let r=await db.from('facturas_viaticos').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadData();go('viaticos')}
function cobrosPage(){let ef=cobros.reduce((a,x)=>a+Number(x.efectivo||0),0),cd=cobros.reduce((a,x)=>a+Number(x.cheque_dia||0),0),cm=cobros.reduce((a,x)=>a+Number(x.cheque_mes||0),0),cp=cobros.reduce((a,x)=>a+Number(x.cheque_prefechado||0),0),t=ef+cd+cm+cp,rows=cobros.map(x=>`<div class="card"><div class="cobro-row"><div style="flex:1"><b>${x.cobro}</b><small style="display:block;color:var(--muted);margin-top:4px">${x.nombre_cliente}</small><small style="display:block;color:var(--muted)">Recibo: ${x.numero_recibo}</small></div><b>${money(Number(x.efectivo)+Number(x.cheque_dia)+Number(x.cheque_mes)+Number(x.cheque_prefechado))}</b><div class="dots" onclick="menuCobro('${x.id}')">⋮</div></div></div>`).join('');content.innerHTML=`<div class="cobro-head"><div><div class="label">LIQUIDACIÓN DE COBROS</div><div class="value">${weekText()}</div></div><div style="font-size:28px;font-weight:900">▣</div></div>${weekCard()}<div class="card"><div class="label">TOTALES DE COBRO</div><div class="money-grid" style="margin-top:10px"><div class="money-card"><span>EFECTIVO</span><b>${money(ef)}</b></div><div class="money-card"><span>CHEQUE AL DÍA</span><b>${money(cd)}</b></div><div class="money-card"><span>CHEQUE DENTRO DEL MES</span><b>${money(cm)}</b></div><div class="money-card"><span>CHEQUE PREF. SIGUIENTE MES</span><b>${money(cp)}</b></div></div><div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><span class="label">TOTAL GENERAL</span><div class="total">${money(t)}</div></div></div><div style="font-weight:800;margin:18px 0 10px">Cobros registrados (${cobros.length})</div>${rows||'<div class="card muted" style="text-align:center;padding:30px">No hay cobros registrados</div>'}<button class="btn primary" onclick="editingCobroId=null;go('cobroform')">＋ AGREGAR COBRO</button><div class="row" style="margin-top:10px"><button class="btn whatsapp" onclick="shareCobrosPDF()">◉ COMPARTIR PDF</button><button class="btn download" onclick="downloadCobrosPDF()">⇩ DE ha_pago||''}"></div><div class="field"><label>Q TRANSF Y/O DEPÓSITOS</label><input id="ctrans" value="${x.transferencia_deposito||''}"></div><div class="field"><label>% DE DOCUMENTO / BANCO</label><input id="cpct" value="${x.porcentaje_documento_banco||''}"></div><button class="btn primary" onclick="saveCobro()">GUARDAR COBRO EN LA NUBE</button></div>`;let bancos=['BANCO INDUSTRIAL','BANRURAL','BAC CREDOMATIC','BANCO G&T','FICOHSA','PROMERICA','BAM','BANTRAB'];if(bancos.includes(x.banco))cbanco.value=x.banco;else if(x.banco){cbanco.value='OTRO';cotrobanco.value=x.banco;otroBancoBox.classList.remove('hidden')}cbanco.onchange=()=>{otroBancoBox.classList.toggle('hidden',cbanco.value!=='OTRO');if(cbanco.value!=='OTRO')cotrobanco.value=''}}
async function saveCobro(){let banco=cbanco.value==='OTRO'?(cotrobanco.value||'').trim():cbanco.value,x={semana_id:semana.id,vendedor_id:vendedor.id,cobro:ccobro.value.trim(),nombre_cliente:ccliente.value.trim(),numero_recibo:crecibo.value.trim(),efectivo:Number(cefectivo.value||0),cheque_dia:Number(ccdia.value||0),cheque_mes:Number(ccmes.value||0),cheque_prefechado:Number(ccpref.value||0),banco,numero_cheque:cnumcheque.value.trim(),fecha_pago:cfecha.value||null,transferencia_deposito:ctrans.value.trim(),porcentaje_documento_banco:cpct.value.trim()};if(!x.cobro||!x.nombre_cliente||!x.numero_recibo){alert('CÓDIGO, NOMBRE CLIENTE y # NÚMERO DE RECIBO son obligatorios.');return}let r=editingCobroId?await db.from('cobros_liquidacion').update(x).eq('id',editingCobroId):await db.from('cobros_liquidacion').insert(x);if(r.error){alert('No se pudo guardar el cobro: '+r.error.message);return}await loadData();editingCobroId=null;go('cobros')}
function menuCobro(id){let x=cobros.find(a=>a.id===id),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>${x.cobro}</h3><p><b>${x.nombre_cliente}</b><br>Recibo: ${x.numero_recibo}<br>Total: ${money(Number(x.efectivo)+Number(x.cheque_dia)+Number(x.cheque_mes)+Number(x.cheque_prefechado))}</p><div class="modal-actions"><button class="btn outline" onclick="editingCobroId='${id}';this.closest('.modal').remove();go('cobroform')">✎ Editar</button><button class="btn danger" onclick="deleteCobro('${id}');this.closest('.modal').remove()">🗑 Eliminar</button></div></div>`;document.querySelector('.phone').appendChild(m)}async function deleteCobro(id){let r=await db.from('cobros_liquidacion').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadData();go('cobros')}
function openWeekChanger(){let sug=nextWeekFromEnd(semana.fecha_fin),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>📅 Cambiar semana de liquidación</h3><p>Se propone la siguiente semana: <b>${fmtDate(sug.inicio)} al ${fmtDate(sug.fin)}</b>.</p><div class="field"><label>SELECCIONE CUALQUIER DÍA DE LA SEMANA</label><input id="weekPick" type="date" value="${sug.inicio}" onchange="previewWeek()"></div><div id="weekPrev" class="notice">Nueva semana: <b>${fmtDate(sug.inicio)} al ${fmtDate(sug.fin)}</b></div><p>Puede seleccionar cualquier semana, anterior o posterior. Si ya existe, se abrirá y conservará sus datos.</p><div class="modal-actions"><button class="btn outline" onclick="this.closest('.modal').remove()">CANCELAR</button><button class="btn primary" onclick="changeWeek()">CONFIRMAR</button></div></div>`;document.querySelector('.phone').appendChild(m)}function previewWeek(){let w=weekFromDate(weekPick.value);if(w)weekPrev.innerHTML=`Nueva semana: <b>${fmtDate(w.inicio)} al ${fmtDate(w.fin)}</b>`}async function changeWeek(){let w=weekFromDate(weekPick.value);if(!w)return alert('Seleccione una fecha válida.');if(!confirm(`¿Desea cambiar la liquidación a ${fmtDate(w.inicio)} al ${fmtDate(w.fin)}?`))return;let q=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(q.error){alert(q.error.message);return}let target=q.data;if(target&&target.id===semana.id){document.querySelector('.modal')?.remove();return}let a=await db.from('semanas_liquidacion').update({estado:'CERRADA'}).eq('vendedor_id',vendedor.id).eq('estado','ABIERTA');if(a.error){alert(a.error.message);return}if(target){let b=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',target.id).select().single();if(b.error){alert(b.error.message);return}semana=b.data}else{let b=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:w.inicio,fecha_fin:w.fin,estado:'ABIERTA'}).select().single();if(b.error){alert(b.error.message);return}semana=b.data}await loadData();document.querySelector('.modal')?.remove();go('home')}
function confirmDepurar(){let n=nextWeekFromEnd(semana.fecha_fin),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>⚠ ¿Depurar esta semana?</h3><p>Esta acción <b>ELIMINARÁ TODOS LOS VIÁTICOS Y COBROS</b> registrados en la semana actual. Después podrás seleccionar la fecha de liquidación que corresponda.</p><div class="notice">Semana actual: <b>${weekText()}</b><br>Propuesta automática: <b>${fmtDate(n.inicio)} al ${fmtDate(n.fin)}</b></div><div class="modal-actions"><button class="btn outline" onclick="this.closest('.modal').remove()">CANCELAR</button><button class="btn danger" onclick="depurar();this.closest('.modal').remove()">ELIMINAR Y CONTINUAR</button></div></div>`;document.querySelector('.phone').appendChild(m)}
async function depurar(){try{let semanaId=semana.id;let f=await db.from('facturas_viaticos').delete().eq('semana_id',semanaId).select('id');if(f.error)throw new Error('Viáticos: '+f.error.message);let c=await db.from('cobros_liquidacion').delete().eq('semana_id',semanaId).select('id');if(c.error)throw new Error('Cobros: '+c.error.message);let a=await db.from('semanas_liquidacion').update({estado:'CERRADA'}).eq('id',semanaId);if(a.error)throw new Error('Semana: '+a.error.message);let n=nextWeekFromEnd(semana.fecha_fin),e=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',n.inicio).eq('fecha_fin',n.fin).maybeSingle();if(e.error)throw e.error;if(e.data){let u=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',e.data.id).select().single();if(u.error)throw u.error;semana=u.data}else{let b=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:n.inicio,fecha_fin:n.fin,estado:'ABIERTA'}).select().single();if(b.error)throw b.error;semana=b.data}await loadData();alert(`Depuración completada. Se eliminaron ${f.data?.length||0} viáticos y ${c.data?.length||0} cobros.\n\nNueva semana propuesta: ${fmtDate(n.inicio)} al ${fmtDate(n.fin)}.`);go('home')}catch(e){alert('No se pudo completar la depuración.\n\n'+e.message)}}
function historyPage(){content.innerHTML=`<h3>Historial de liquidaciones</h3>${history.map(h=>`<div class="card history-item"><div><b>${fmtDate(h.fecha_inicio)} al ${fmtDate(h.fecha_fin)}</b><small style="display:block;color:var(--muted);margin-top:5px">Liquidación cerrada</small></div><span class="badge">CERRADA</span></div>`).join('')||'<div class="card muted">No hay liquidaciones cerradas.</div>'}<div class="card history-item"><div><b>${weekText()}</b><small style="display:block;color:var(--muted);margin-top:5px">Liquidación actual</small></div><span class="badge open">ABIERTA</span></div>`}
function pdfHeader(doc,title){doc.setFillColor(231,184,63);doc.roundedRect(10,10,277,18,2,2,'F');doc.setTextColor(17,17,17);doc.setFontSize(16);doc.text(title,282,21,{align:'right'});doc.setTextColor(30,30,30);doc.setFontSize(9);doc.text(`Nombre: ${vendedor.nombre}   Ruta: ${vendedor.ruta}   Código: ${vendedor.codigo}`,14,34);doc.text(`Semana de liquidación: ${weekText()}`,14,40)}
function pdfDoc(tipo){let arr=tipo==='cobro'?cobros:tipo==='depreciacion'?invoices.filter(x=>x.tipo_registro==='DEPRECIACION'):invoices.filter(x=>x.tipo_registro==='VIATICOS SEMANA');if(!arr.length){alert('No hay datos para generar el PDF.');return null}let{jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4');if(tipo==='cobro'){pdfHeader(doc,'LIQUIDACIÓN DE COBROS');let body=arr.map((x,i)=>[i+1,x.cobro,x.nombre_cliente,x.numero_recibo,money(x.efectivo),money(x.cheque_dia),money(x.cheque_mes),money(x.cheque_prefechado),x.banco||'',x.numero_cheque||'',fmtDate(x.fecha_pago)||'',x.transferencia_deposito||'',x.porcentaje_documento_banco||'']);doc.autoTable({startY:46,head:[['No.','CÓDIGO','NOMBRE CLIENTE','# RECIBO','EFECTIVO','CHEQUE AL DÍA','CHEQUE MES','PREF. SIG. MES','BANCO','# CHEQUE','FECHA PAGO','TRANSF./DEP.','% DOC./BANCO']],body,theme:'grid',styles:{fontSize:6},headStyles:{fillColor:[32,38,43],textColor:[243,245,247]}});let vals=[['Efectivo',arr.reduce((a,x)=>a+Number(x.efectivo||0),0)],['Cheque al día',arr.reduce((a,x)=>a+Number(x.cheque_dia||0),0)],['Cheque dentro del mes',arr.reduce((a,x)=>a+Number(x.cheque_mes||0),0)],['Cheque pre-fechado siguiente mes',arr.reduce((a,x)=>a+Number(x.cheque_prefechado||0),0)]];let y=doc.lastAutoTable.finalY+9;doc.setFontSize(9);vals.forEach(v=>{doc.text(`${v[0]}: ${money(v[1])}`,220,y,{align:'right'});y+=5});let total=vals.reduce((a,x)=>a+x[1],0);doc.setFontSize(13);doc.text(`TOTAL GENERAL: ${money(total)}`,220,y+3,{align:'right'})}else{pdfHeader(doc,tipo==='depreciacion'?'LIQUIDACIÓN DE DEPRECIACIÓN':'LIQUIDACIÓN DE VIÁTICOS');let body=arr.map((x,i)=>[i+1,fmtDate(x.fecha_factura),x.serie,x.numero,x.razon_social,x.concepto,money(x.monto)]);doc.autoTable({startY:46,head:[['No.','Fecha','Serie','Número','Razón Social','Concepto','Monto']],body,theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[32,38,43],textColor:[243,245,247]}});doc.setFontSize(12);doc.text(`TOTAL: ${money(arr.reduce((s,x)=>s+Number(x.monto),0))}`,250,doc.lastAutoTable.finalY+9,{align:'right'})}return doc}
async function sharePDF(doc,name,text){let blob=doc.output('blob'),file=new File([blob],name,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Liquidación Comercial',text,files:[file]});return}catch(e){if(e.name==='AbortError')return}}doc.save(name);window.open('https://wa.me/?text='+encodeURIComponent(text+'\nEl PDF fue descargado; adjúntalo en WhatsApp.'),'_blank')}function shareViaticosPDF(){let d=pdfDoc('viatico');if(d)sharePDF(d,`Viaticos_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`,`Liquidación de Viáticos - ${weekText()}`)}function shareDepreciacionPDF(){let d=pdfDoc('depreciacion');if(d)sharePDF(d,`Depreciacion_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`,`Liquidación de Depreciación - ${weekText()}`)}function shareCobrosPDF(){let d=pdfDoc('cobro');if(d)sharePDF(d,`Cobros_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`,`Liquidación de Cobros - ${weekText()}`)}function downloadViaticosPDF(){let d=pdfDoc('viatico');if(d)d.save(`Viaticos_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`)}function downloadDepreciacionPDF(){let d=pdfDoc('depreciacion');if(d)d.save(`Depreciacion_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`)}function downloadCobrosPDF(){let d=pdfDoc('cobro');if(d)d.save(`Cobros_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`)}init();
</script></body></html>
