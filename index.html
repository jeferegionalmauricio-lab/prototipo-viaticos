<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidación Comercial</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d0f;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:390px;min-height:100vh;background:#0b0d0f;padding:22px 16px}.logo{background:#101418;border:1px solid #2b3239;border-radius:16px;padding:18px;margin-bottom:16px;text-align:center}.logo h1{font-size:19px;margin:0 0 6px}.logo p{margin:0;color:#9aa4ad;font-size:12px}.list{display:grid;gap:9px}.user{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #2b3239;border-radius:12px;background:#14181c;color:#f3f5f7;cursor:pointer;text-align:left}.user b{width:65px;text-align:center;background:#f4c38f;color:#111;border-radius:7px;padding:10px 5px}.user.admin b{background:#e7b83f}.user span{font-weight:800;font-size:13px}.login{margin-top:18px;padding:18px;background:#14181c;border:1px solid #2b3239;border-radius:14px;display:none}.login h2{font-size:16px;margin:0 0 6px}.login p{color:#9aa4ad;font-size:12px;margin:0 0 12px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #2b3239;background:#0d1114;color:#fff;font-size:20px;letter-spacing:8px;text-align:center}.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#e7b83f;color:#111;font-weight:900;cursor:pointer}.err{color:#ef8990;font-size:12px;margin-top:8px;min-height:16px}.loading{text-align:center;padding:40px;color:#9aa4ad}</style></head><body><div class="wrap"><div class="logo"><h1>LIQUIDACIÓN COMERCIAL</h1><p>Seleccione su usuario para continuar</p></div><div class="list" id="list"></div><div class="login" id="login"><h2 id="who"></h2><p>Ingrese su contraseña de 4 dígitos</p><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password" autocomplete="off"><button class="btn" id="enter">INGRESAR</button><div class="err" id="err"></div></div></div><script>const users=[['3207','NELSON MARROQUÍN'],['3822','GABRIEL MARTÍNEZ'],['4708','JHONNY JUNIOR CERMEÑO'],['4918','JUAN LAJUJ'],['4004','CESAR PAC'],['4420','MOISÉS CASTILLO'],['4389','TADEO CARRASCOZA'],['3318','CARLOS GIOVANNI LORENZANA ESTRADA'],['4765','MAURICIO ORELLANA'],['ADMIN','ADMINISTRADOR']];let selected=null;const list=document.getElementById('list'),login=document.getElementById('login'),pinEl=document.getElementById('pin'),err=document.getElementById('err');list.innerHTML=users.map(u=>`<button class="user ${u[0]==='ADMIN'?'admin':''}" data-code="${u[0]}"><b>${u[0]}</b><span>${u[1]}</span></button>`).join('');document.querySelectorAll('.user').forEach(el=>el.onclick=()=>{selected=users.find(u=>u[0]===el.dataset.code);document.getElementById('who').textContent=selected[0]+' · '+selected[1];login.style.display='block';pinEl.value='';err.textContent='';pinEl.focus()});async function loadApp(code,pin){document.querySelector('.wrap').innerHTML='<div class="loading">Verificando usuario y conectando con la base de datos...</div>';try{const source=await fetch('app.html?cb='+Date.now(),{cache:'no-store'}).then(r=>r.text());const m=source.match(/const b="([^"]+)";/);if(!m)throw new Error('No se encontró el sistema principal.');const raw=atob(m[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();out=out.replace(/VENDEDOR_CODIGO='[^']*'/,`VENDEDOR_CODIGO='${code}'`);out=out.replace(/init\(\);/g,'');const safePin=String(pin||'').replace(/[^0-9]/g,'');out += `\n<script>async function ensureOpenWeek(){if(!vendedor?.id)throw new Error('No se encontró el vendedor autenticado.');let q=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','ABIERTA').order('fecha_inicio',{ascending:false}).limit(1).maybeSingle();if(q.error)throw q.error;if(q.data){semana=q.data;return}let w=weekFromDate(dateISO(new Date()));if(!w)throw new Error('No se pudo calcular la semana actual.');let e=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(e.error)throw e.error;if(e.data){let u=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',e.data.id).select().single();if(u.error)throw u.error;semana=u.data;return}let n=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:w.inicio,fecha_fin:w.fin,estado:'ABIERTA'}).select().single();if(n.error)throw n.error;semana=n.data}async function loadData(){if(!vendedor?.id||!semana?.id)throw new Error('No hay una semana activa para cargar.');let [f,c,h]=await Promise.all([db.from('facturas_viaticos').select('*').eq('vendedor_id',vendedor.id).eq('semana_id',semana.id).order('fecha_factura',{ascending:false}),db.from('cobros_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('semana_id',semana.id),db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','CERRADA').order('fecha_inicio',{ascending:false})]);if(f.error||c.error||h.error)throw(f.error||c.error||h.error);invoices=f.data||[];cobros=c.data||[];history=h.data||[]};window.logout=async function(){try{await db.auth.signOut()}finally{sessionStorage.removeItem('liquidacion_user');location.reload()}};window.pdfHeaderViaticos=function(doc,title){doc.setFillColor(10,10,10);doc.rect(10,10,277,18,'F');doc.setTextColor(231,184,63);doc.setFontSize(16);doc.text(title||'LIQUIDACIÓN DE VIÁTICOS',14,21,{align:'left'});doc.setTextColor(30,30,30);doc.setFontSize(9);doc.text('Nombre: '+vendedor.nombre+'   Ruta: '+vendedor.ruta+'   Código: '+vendedor.codigo,14,34);doc.text('Semana de liquidación: '+weekText(),14,40)};window.transferAmount=function(v){return Number(String(v||'').replace(/[^0-9.-]/g,''))||0};var baseCobrosPage=window.cobrosPage;window.cobrosPage=function(){baseCobrosPage();var tr=cobros.reduce(function(a,x){return a+transferAmount(x.transferencia_deposito)},0),ef=cobros.reduce(function(a,x){return a+Number(x.efectivo||0)},0),cd=cobros.reduce(function(a,x){return a+Number(x.cheque_dia||0)},0),cm=cobros.reduce(function(a,x){return a+Number(x.cheque_mes||0)},0),cp=cobros.reduce(function(a,x){return a+Number(x.cheque_prefechado||0)},0),grid=content.querySelector('.money-grid'),total=content.querySelector('.total');if(grid)grid.insertAdjacentHTML('beforeend','<div class="money-card"><span>TRANSF. / DEP.</span><b>'+money(tr)+'</b></div>');if(total)total.textContent=money(ef+cd+cm+cp+tr)};var basePdfDoc=window.pdfDoc;window.pdfDoc=function(tipo){if(tipo!=='cobro')return basePdfDoc(tipo);var arr=cobros;if(!arr.length){alert('No hay datos para generar el PDF.');return null}var jsPDF=window.jspdf.jsPDF,doc=new jsPDF('l','mm','a4');pdfHeaderCobro(doc,'LIQUIDACIÓN DE COBROS');var body=arr.map(function(x,i){return[i+1,x.cobro,x.nombre_cliente,x.numero_recibo,money(x.efectivo),money(x.cheque_dia),money(x.cheque_mes),money(x.cheque_prefechado),x.banco||'',x.numero_cheque||'',fmtDate(x.fecha_pago)||'',x.transferencia_deposito||'',x.porcentaje_documento_banco||'']});doc.autoTable({startY:46,head:[['No.','CÓDIGO','NOMBRE CLIENTE','# RECIBO','EFECTIVO','CHEQUE AL DÍA','CHEQUE MES','PREF. SIG. MES','BANCO','# CHEQUE','FECHA PAGO','TRANSF./DEP.','% DOC./BANCO']],body:body,theme:'grid',styles:{fontSize:6},headStyles:{fillColor:[32,38,43],textColor:[243,245,247]}});var vals=[['Efectivo',arr.reduce(function(a,x){return a+Number(x.efectivo||0)},0)],['Cheque al día',arr.reduce(function(a,x){return a+Number(x.cheque_dia||0)},0)],['Cheque dentro del mes',arr.reduce(function(a,x){return a+Number(x.cheque_mes||0)},0)],['Cheque pre-fechado siguiente mes',arr.reduce(function(a,x){return a+Number(x.cheque_prefechado||0)},0)],['Transferencias / depósitos',arr.reduce(function(a,x){return a+transferAmount(x.transferencia_deposito)},0)]];var y=doc.lastAutoTable.finalY+9;doc.setFontSize(9);vals.forEach(function(v){doc.text(v[0]+': '+money(v[1]),220,y,{align:'right'});y+=5});var total=vals.reduce(function(a,x){return a+x[1]},0);doc.setFontSize(13);doc.text('TOTAL GENERAL: '+money(total),220,y+3,{align:'right'});return doc};(async()=>{try{await db.auth.signOut();const a=await db.auth.signInWithPassword({email:'${code.toLowerCase()}@liquidacion.local',password:'${safePin}'});if(a.error)throw a.error;sessionStorage.setItem('liquidacion_user','${code}');await init()}catch(e){sessionStorage.removeItem('liquidacion_user');document.body.innerHTML='<div style="font-family:Arial;padding:30px;max-width:390px;margin:auto;text-align:center"><h3>No se pudo iniciar sesión</h3><p>'+String(e.message||e)+'</p><button style="padding:12px 20px" onclick="location.reload()">VOLVER</button></div>'}})();<\/script>`;document.open();document.write(out);document.close()}catch(e){sessionStorage.removeItem('liquidacion_user');document.body.innerHTML='<pre style="padding:20px">No se pudo cargar el sistema: '+e.message+'</pre>'}}async function enter(){const p=String(pinEl.value||'').replace(/\D/g,'');if(!selected)return;if(p.length!==4){err.textContent='Ingrese exactamente 4 dígitos.';return}await loadApp(selected[0],p)}document.getElementById('enter').onclick=enter;pinEl.onkeydown=e=>{if(e.key==='Enter')enter()};</script></body></html>
