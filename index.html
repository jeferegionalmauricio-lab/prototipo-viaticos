<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Liquidación Comercial - Prototipo</title>
<style>
:root{--bg:#0b0d0f;--card:#14181c;--card2:#1a2025;--line:#2b3239;--text:#f3f5f7;--muted:#9aa4ad;--yellow:#e7b83f;--green:#31c48d;--blue:#4f9cf9;--red:#ef6b73;--wa:#25d366}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#080a0c,#11161a);color:var(--text)}
.app{width:100%;min-height:100vh;display:flex;justify-content:center}.phone{width:390px;min-height:844px;background:var(--bg);box-shadow:0 0 35px #0009;position:relative;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{height:72px;background:#101418;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.top .title{font-weight:800;font-size:16px}.icon{font-size:23px;cursor:pointer;color:var(--yellow)}
.screen{padding:18px 16px 95px;min-height:772px}.profile{text-align:center;padding:18px 0}.avatar{width:78px;height:78px;border-radius:50%;background:var(--yellow);color:#101010;margin:auto;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}.profile h2{margin:12px 0 5px}.muted{color:var(--muted)}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.module{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;box-shadow:0 12px 30px #0005;cursor:pointer}.module .mi{font-size:38px;color:var(--yellow)}.module b{display:block;margin-top:8px}.module small{color:var(--muted)}
.card{background:rgba(20,24,28,.96);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 12px 35px #0004}.label{font-size:11px;color:var(--muted);letter-spacing:.4px}.value{font-weight:800;font-size:15px;margin-top:4px}.week{display:flex;justify-content:space-between;align-items:center;gap:10px}.week-info{flex:1;min-width:0}.total{font-size:25px;color:var(--yellow);font-weight:900}.invoice{display:flex;align-items:center;gap:9px}.datebox{width:45px;text-align:center;font-weight:800}.datebox small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.invoice-main{flex:1;min-width:0}.invoice-main b{font-size:13px}.invoice-main small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900}.dots{font-size:23px;cursor:pointer;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:13px 14px;font-weight:800;cursor:pointer;font-size:13px}.primary{background:var(--yellow);color:#111;width:100%}.outline{background:var(--card2);color:var(--text);border:1px solid var(--line)}.whatsapp{background:var(--wa);color:#07140b}.danger{background:#211719;border:1px solid #3a3033;color:#ef8990}.smallbtn{padding:8px 10px;font-size:10px;white-space:nowrap}.row{display:flex;gap:8px}.row .btn{flex:1}
.field{margin-bottom:12px}.field label{font-size:11px;font-weight:700;display:block;margin-bottom:5px;color:var(--muted)}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#0d1114;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--yellow)}.field input[type=date]{color-scheme:dark}
.bottom{position:absolute;bottom:0;left:0;right:0;background:#101418;color:var(--muted);height:68px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line)}.navitem{text-align:center;font-size:11px;cursor:pointer}.navitem span{display:block;font-size:22px}.navitem.active{color:var(--yellow)}
.modal{position:absolute;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}.modalbox{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:22px;width:100%;box-shadow:0 -15px 45px #0008}.modalbox h3{margin-top:0}.modalbox p{color:var(--muted);font-size:13px;line-height:1.5}.modal-actions{display:flex;gap:8px}.modal-actions .btn{flex:1}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#163c31;color:#55e0ad;font-size:10px;font-weight:800}.badge.open{background:#3a3017;color:#e7c85d}.history-item{display:flex;justify-content:space-between;align-items:center;gap:8px}.pdficon{color:var(--red);font-size:23px}.notice{background:#211d0f;border-left:4px solid var(--yellow);padding:12px;border-radius:8px;font-size:12px;margin-bottom:12px}.loading{text-align:center;padding:45px 10px;color:var(--muted)}@media(max-width:420px){.phone{width:100%;border:0}}
</style>
</head>
<body>
<div class="app"><div class="phone">
<div class="top"><div class="icon" onclick="go('home')">☰</div><div class="title" id="topTitle">LIQUIDACIÓN COMERCIAL</div><div class="icon">♢</div></div>
<div id="content" class="screen"><div class="loading">Conectando con la base de datos...</div></div>
<div class="bottom"><div class="navitem active" onclick="go('home')"><span>⌂</span>Inicio</div><div class="navitem" onclick="go('viaticos')"><span>⛽</span>Viáticos</div><div class="navitem" onclick="go('history')"><span>▤</span>Historial</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SUPABASE_URL='https://zuvafmswlnpphsjftras.supabase.co';
const SUPABASE_KEY='sb_publishable_Zhpsh4JM1Zhl22lhSxPkpg_lwBjd9t-';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const VENDEDOR_CODIGO='3207';
let vendedor=null,semana=null,invoices=[],history=[],editingId=null;const content=document.getElementById('content');
function money(n){return 'Q '+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(v){if(!v)return '';let p=v.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:''}
function inputDate(v){if(!v)return '';let p=v.split('/');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:''}
function weekText(){return semana?`${fmtDate(semana.fecha_inicio)} al ${fmtDate(semana.fecha_fin)}`:'Sin semana activa'}
function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mondayFor(value){let d=new Date(value+'T12:00:00');if(isNaN(d))return null;let day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d}
function weekFromDate(value){let monday=mondayFor(value);if(!monday)return null;let saturday=new Date(monday);saturday.setDate(monday.getDate()+5);return{inicio:dateISO(monday),fin:dateISO(saturday)}}
function nextWeekFromEnd(endDate){let d=new Date(endDate+'T12:00:00');if(isNaN(d))return null;d.setDate(d.getDate()+1);return weekFromDate(dateISO(d))}
async function init(){try{let r=await db.from('vendedores').select('*').eq('codigo',VENDEDOR_CODIGO).single();if(r.error)throw r.error;vendedor=r.data;await ensureOpenWeek();await loadData();go('home')}catch(e){console.error(e);content.innerHTML=`<div class="notice"><b>No se pudo conectar a la base de datos.</b><br><small>${e.message||e}</small></div><button class="btn primary" onclick="init()">REINTENTAR</button>`}}
async function ensureOpenWeek(){let r=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','ABIERTA').order('fecha_inicio',{ascending:false}).limit(1).maybeSingle();if(r.error)throw r.error;if(r.data){semana=r.data;return}let now=new Date(),w=weekFromDate(dateISO(now));let existing=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(existing.error)throw existing.error;if(existing.data){if(existing.data.estado!=='ABIERTA')throw new Error('La semana actual ya está cerrada. Use CAMBIAR para seleccionar la semana correcta.');semana=existing.data;return}let n=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:w.inicio,fecha_fin:w.fin,estado:'ABIERTA'}).select().single();if(n.error)throw n.error;semana=n.data}
async function loadData(){let f=await db.from('facturas_viaticos').select('*').eq('semana_id',semana.id).order('fecha_factura',{ascending:true}).order('created_at',{ascending:true});if(f.error)throw f.error;invoices=f.data||[];let h=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','CERRADA').order('fecha_inicio',{ascending:false});if(h.error)throw h.error;history=h.data||[]}
function go(page){document.getElementById('topTitle').textContent=page==='home'?'LIQUIDACIÓN COMERCIAL':page==='viaticos'?'VIÁTICOS':page==='history'?'HISTORIAL':'NUEVA FACTURA';if(page==='home')home();if(page==='viaticos')viaticos();if(page==='history')historyPage();if(page==='form')form();document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));let n=page==='home'?0:page==='viaticos'?1:page==='history'?2:-1;if(n>=0)document.querySelectorAll('.navitem')[n].classList.add('active')}
function home(){content.innerHTML=`<div class="profile"><div class="avatar">V</div><h2>${vendedor?.nombre||'Vendedor'}</h2><div class="muted">Ruta: <b>${vendedor?.ruta||''}</b></div><div class="muted">Código: <b>${vendedor?.codigo||''}</b></div></div><div class="notice"><b>Semana activa:</b><br>${weekText()}<br><small>☁ Datos sincronizados en la nube</small></div><div class="modules"><div class="module" onclick="go('viaticos')"><div class="mi">⛽</div><b>VIÁTICOS</b><small>Registro y liquidación semanal</small></div><div class="module"><div class="mi">●</div><b>COBRO</b><small>Disponible en Etapa 2</small></div></div>`}
function viaticos(){let total=invoices.reduce((a,x)=>a+Number(x.monto),0),totalV=invoices.filter(x=>x.tipo_registro==='VIATICOS SEMANA').reduce((a,x)=>a+Number(x.monto),0),totalD=invoices.filter(x=>x.tipo_registro==='DEPRECIACION').reduce((a,x)=>a+Number(x.monto),0);let rows=invoices.map(x=>`<div class="card invoice"><div style="width:78px;text-align:center;font-size:9px;font-weight:900;padding:7px 4px;border-radius:8px;background:${x.tipo_registro==='DEPRECIACION'?'#172d4b':'#163c31'};color:${x.tipo_registro==='DEPRECIACION'?'#70adff':'#55e0ad'}">${x.tipo_registro==='DEPRECIACION'?'DEPRECIACIÓN':'VIÁTICO'}</div><div class="datebox">${fmtDate(x.fecha_factura).slice(0,2)}<small>${fmtDate(x.fecha_factura).slice(3,5)==='08'?'AGO':''}</small></div><div class="invoice-main"><b>${x.serie}</b><small>${x.numero}</small><small>${x.concepto}</small></div><div class="amount">${money(x.monto)}</div><div class="dots" onclick="menu('${x.id}')">⋮</div></div>`).join('');content.innerHTML=`<div class="card week"><div class="week-info"><div class="label">SEMANA DE LIQUIDACIÓN</div><div class="value">${weekText()}</div></div><button class="btn outline smallbtn" onclick="openWeekChanger()">✎ CAMBIAR</button></div><div class="card"><div class="label">TOTAL GENERAL</div><div class="total">${money(total)}</div><div class="row" style="margin-top:12px"><div style="flex:1"><span class="badge">VIÁTICOS</span><b style="display:block;margin-top:5px">${money(totalV)}</b></div><div style="flex:1"><span class="badge" style="background:#172d4b;color:#70adff">DEPRECIACIÓN</span><b style="display:block;margin-top:5px">${money(totalD)}</b></div></div></div><div class="notice"><b>Base compartida:</b> las modificaciones se guardan en la nube. Puedes abrir el mismo enlace en computadora o celular y ver los mismos datos.</div><div style="font-weight:800;margin:18px 0 10px">Facturas cargadas (${invoices.length})</div>${rows||'<div class="card muted" style="text-align:center;padding:30px">No hay facturas cargadas</div>'}<button class="btn primary" onclick="editingId=null;go('form')">＋ AGREGAR FACTURA</button><div class="row" style="margin-top:10px"><button class="btn whatsapp" onclick="sharePDFWhatsApp()">◉ COMPARTIR PDF POR WHATSAPP</button><button class="btn danger" onclick="confirmDepurar()">▣ DEPURAR</button></div>`}
function form(){let x=editingId?invoices.find(a=>a.id===editingId):null;x=x||{fecha_factura:'',serie:'',numero:'',razon_social:'',concepto:'COMBUSTIBLE',monto:'',tipo_registro:'VIATICOS SEMANA'};content.innerHTML=`<div class="card"><div class="field"><label>FECHA DE FACTURA *</label><input id="fdate" type="date" value="${inputDate(x.fecha_factura)}"></div><div class="field"><label>SERIE *</label><input id="fserie" value="${x.serie||''}"></div><div class="field"><label>NÚMERO *</label><input id="fnum" value="${x.numero||''}"></div><div class="field"><label>RAZÓN SOCIAL *</label><input id="frazon" value="${x.razon_social||''}"></div><div class="field"><label>CONCEPTO *</label><select id="fconcepto"><option>COMBUSTIBLE</option><option>HOSPEDAJE</option><option>ALIMENTACION</option></select></div><div class="field"><label>MONTO *</label><input id="fmonto" type="number" step="0.01" min="0.01" value="${x.monto||''}"></div><div class="field"><label>TIPO DE REGISTRO *</label><select id="fobs"><option value="VIATICOS SEMANA">VIATICOS SEMANA</option><option value="DEPRECIACION">DEPRECIACION</option></select></div><button class="btn primary" onclick="saveInvoice()">GUARDAR EN LA NUBE</button></div>`;fconcepto.value=x.concepto;fobs.value=x.tipo_registro}
async function saveInvoice(){let x={fecha_factura:fdate.value,serie:fserie.value.trim(),numero:fnum.value.trim(),razon_social:frazon.value.trim(),concepto:fconcepto.value,monto:Number(fmonto.value),tipo_registro:fobs.value,vendedor_id:vendedor.id,semana_id:semana.id};if(!x.fecha_factura||!x.serie||!x.numero||!x.razon_social||!x.monto){alert('Completa los campos obligatorios.');return}let r=editingId?await db.from('facturas_viaticos').update(x).eq('id',editingId):await db.from('facturas_viaticos').insert(x);if(r.error){alert('No se pudo guardar: '+r.error.message);return}await loadData();editingId=null;go('viaticos')}
function menu(id){let x=invoices.find(a=>a.id===id),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Factura ${x.serie}</h3><p>${x.razon_social}<br>${x.concepto} · ${money(x.monto)}<br>${x.tipo_registro}</p><div class="modal-actions"><button class="btn outline" onclick="editingId='${id}';this.closest('.modal').remove();go('form')">✎ Editar</button><button class="btn danger" onclick="deleteInvoice('${id}');this.closest('.modal').remove()">🗑 Eliminar</button></div></div>`;document.querySelector('.phone').appendChild(m)}
async function deleteInvoice(id){let r=await db.from('facturas_viaticos').delete().eq('id',id);if(r.error){alert('No se pudo eliminar: '+r.error.message);return}await loadData();go('viaticos')}
function openWeekChanger(){let suggested=nextWeekFromEnd(semana.fecha_fin),base=suggested?suggested.inicio:semana.fecha_inicio,m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>📅 Cambiar semana de liquidación</h3><p>El sistema propone automáticamente la siguiente semana: <b>${fmtDate(suggested.inicio)} al ${fmtDate(suggested.fin)}</b>.</p><div class="field"><label>SELECCIONA CUALQUIER DÍA DE LA SEMANA QUE DESEAS</label><input id="changeWeekDate" type="date" value="${base}" onchange="previewWeekChange()"></div><div id="weekPreview" class="notice">Nueva semana: <b>${fmtDate(suggested.inicio)} al ${fmtDate(suggested.fin)}</b></div><p><b>También puedes seleccionar una semana anterior o una semana que ya exista en el historial.</b></p><div class="modal-actions"><button class="btn outline" onclick="this.closest('.modal').remove()">CANCELAR</button><button class="btn primary" onclick="confirmWeekChange()">CONFIRMAR CAMBIO</button></div></div>`;document.querySelector('.phone').appendChild(m)}
function previewWeekChange(){let v=document.getElementById('changeWeekDate').value,w=weekFromDate(v);if(w)document.getElementById('weekPreview').innerHTML=`Nueva semana: <b>${fmtDate(w.inicio)} al ${fmtDate(w.fin)}</b>`}
async function confirmWeekChange(){let v=document.getElementById('changeWeekDate').value,w=weekFromDate(v);if(!w){alert('Selecciona una fecha válida.');return}let check=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(check.error){alert('No se pudo validar la semana: '+check.error.message);return}let target=check.data;let msg=`¿Deseas cambiar la semana de liquidación a ${fmtDate(w.inicio)} al ${fmtDate(w.fin)}?`;if(target&&target.id!==semana.id){msg+=target.estado==='CERRADA'?`\n\nEsta semana ya existe en el historial. Se abrirá nuevamente para consultarla o trabajar en ella. Sus facturas se conservarán.`:`\n\nEsta semana ya está abierta y será la semana activa.`}else if(invoices.length){msg+=`\n\nYa existen ${invoices.length} factura(s) en la semana actual y permanecerán asociadas a ella.`}if(!confirm(msg))return;
if(target&&target.id!==semana.id){let closeCurrent=await db.from('semanas_liquidacion').update({estado:'CERRADA'}).eq('id',semana.id);if(closeCurrent.error){alert('No se pudo cerrar la semana actual: '+closeCurrent.error.message);return}let openTarget=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',target.id).select().single();if(openTarget.error){await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',semana.id);alert('No se pudo abrir la semana seleccionada: '+openTarget.error.message);return}semana=openTarget.data}else{let r=await db.from('semanas_liquidacion').update({fecha_inicio:w.inicio,fecha_fin:w.fin}).eq('id',semana.id).select().single();if(r.error){alert('No se pudo cambiar la semana: '+r.error.message);return}semana=r.data}await loadData();document.querySelector('.modal')?.remove();go('viaticos')}
function confirmDepurar(){let next=nextWeekFromEnd(semana.fecha_fin),m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>⚠ ¿Depurar esta semana?</h3><p>La liquidación <b>${weekText()}</b> quedará cerrada y todos sus registros permanecerán guardados en el historial.</p><div class="notice">La nueva liquidación será automáticamente:<br><b>${fmtDate(next.inicio)} al ${fmtDate(next.fin)}</b><br><small>La fecha será la siguiente semana de lunes a sábado, aunque depures días después del sábado.</small></div><div class="modal-actions"><button class="btn outline" onclick="this.closest('.modal').remove()">CANCELAR</button><button class="btn danger" onclick="depurar();this.closest('.modal').remove()">CONFIRMAR</button></div></div>`;document.querySelector('.phone').appendChild(m)}
async function depurar(){let next=nextWeekFromEnd(semana.fecha_fin);if(!next){alert('No se pudo calcular la siguiente semana.');return}let r=await db.from('semanas_liquidacion').update({estado:'CERRADA'}).eq('id',semana.id);if(r.error){alert('No se pudo cerrar la semana: '+r.error.message);return}let n=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:next.inicio,fecha_fin:next.fin,estado:'ABIERTA'}).select().single();if(n.error){let existing=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',next.inicio).eq('fecha_fin',next.fin).maybeSingle();if(existing.data){let reopen=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',existing.data.id).select().single();if(!reopen.error){semana=reopen.data;await loadData();alert(`Semana cerrada. Nueva liquidación: ${fmtDate(next.inicio)} al ${fmtDate(next.fin)}`);go('viaticos');return}}alert('La semana se cerró, pero no se pudo crear la nueva: '+n.error.message);return}semana=n.data;await loadData();alert(`Semana cerrada. Nueva liquidación: ${fmtDate(next.inicio)} al ${fmtDate(next.fin)}`);go('viaticos')}
function historyPage(){let current=history.map(h=>`<div class="card history-item"><div><b>${fmtDate(h.fecha_inicio)} al ${fmtDate(h.fecha_fin)}</b><small style="display:block;color:var(--muted);margin-top:5px">Liquidación cerrada</small></div><span class="badge">CERRADA</span><span class="pdficon">▧</span></div>`).join('');content.innerHTML=`<h3>Historial de liquidaciones</h3>${current||'<div class="card muted" style="text-align:center">No hay liquidaciones cerradas.</div>'}<div class="card history-item"><div><b>${weekText()}</b><small style="display:block;color:var(--muted);margin-top:5px">Liquidación actual</small></div><span class="badge open">ABIERTA</span></div>`}
function makePDF(){if(!invoices.length){alert('No hay facturas cargadas para generar el PDF.');return null}let {jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4'),v=invoices.filter(x=>x.tipo_registro==='VIATICOS SEMANA'),d=invoices.filter(x=>x.tipo_registro==='DEPRECIACION');function section(arr,title,idx){if(!arr.length)return; if(idx>0)doc.addPage();doc.setFillColor(16,20,24);doc.rect(10,10,277,14,'F');doc.setTextColor(231,184,63);doc.setFontSize(16);doc.text(title,14,20);doc.setTextColor(30,30,30);doc.setFontSize(9);doc.text(`Nombre: ${vendedor.nombre}   Ruta: ${vendedor.ruta}   Código: ${vendedor.codigo}`,14,31);doc.text(`Semana: ${weekText()}`,14,37);let body=arr.map((x,i)=>[i+1,fmtDate(x.fecha_factura),x.serie,x.numero,x.razon_social,x.concepto,money(x.monto)]);doc.autoTable({startY:43,head:[['No.','Fecha','Serie','Número','Razón Social','Concepto','Monto']],body,theme:'grid',headStyles:{fillColor:[32,38,43],textColor:[243,245,247]},styles:{fontSize:8},columnStyles:{6:{halign:'right'}}});let total=arr.reduce((a,x)=>a+Number(x.monto),0);doc.setFontSize(13);doc.setTextColor(155,113,0);doc.text(`Total: ${money(total)}`,250,doc.lastAutoTable.finalY+10,{align:'right'})}section(v,'LIQUIDACIÓN DE VIÁTICOS',0);section(d,'LIQUIDACIÓN DE DEPRECIACIÓN',v.length?1:0);return doc}
async function sharePDFWhatsApp(){let doc=makePDF();if(!doc)return;let blob=doc.output('blob'),file=new File([blob],`Liquidacion_${semana.fecha_inicio}_${semana.fecha_fin}.pdf`,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'Liquidación Comercial',text:`Liquidación ${weekText()}`,files:[file]});return}catch(e){if(e.name==='AbortError')return}}doc.save(file.name);window.open('https://wa.me/?text='+encodeURIComponent(`Liquidación Comercial - ${weekText()}\nEl PDF fue descargado. Adjúntalo en WhatsApp.`),'_blank')}
init();
</script>
