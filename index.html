<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidación Comercial</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d0f;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:390px;min-height:100vh;background:#0b0d0f;padding:22px 16px}.logo{background:#101418;border:1px solid #2b3239;border-radius:16px;padding:18px;margin-bottom:16px;text-align:center}.logo h1{font-size:19px;margin:0 0 6px}.logo p{margin:0;color:#9aa4ad;font-size:12px}.list{display:grid;gap:9px}.user{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #2b3239;border-radius:12px;background:#14181c;color:#f3f5f7;cursor:pointer;text-align:left}.user b{width:65px;text-align:center;background:#f4c38f;color:#111;border-radius:7px;padding:10px 5px}.user.admin b{background:#e7b83f}.user span{font-weight:800;font-size:13px}.login{margin-top:18px;padding:18px;background:#14181c;border:1px solid #2b3239;border-radius:14px;display:none}.login h2{font-size:16px;margin:0 0 6px}.login p{color:#9aa4ad;font-size:12px;margin:0 0 12px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #2b3239;background:#0d1114;color:#fff;font-size:20px;letter-spacing:8px;text-align:center}.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#e7b83f;color:#111;font-weight:900;cursor:pointer}.err{color:#ef8990;font-size:12px;margin-top:8px;min-height:16px}.loading{text-align:center;padding:40px;color:#9aa4ad}</style></head><body><div class="wrap"><div class="logo"><h1>LIQUIDACIÓN COMERCIAL</h1><p>Seleccione su usuario para continuar</p></div><div class="list" id="list"></div><div class="login" id="login"><h2 id="who"></h2><p>Ingrese su contraseña de 4 dígitos</p><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password" autocomplete="off"><button class="btn" id="enter">INGRESAR</button><div class="err" id="err"></div></div></div><script>const users=[['3207','NELSON MARROQUÍN'],['3822','GABRIEL MARTÍNEZ'],['4708','JHONNY JUNIOR CERMEÑO'],['4918','JUAN LAJUJ'],['4004','CESAR PAC'],['4420','MOISÉS CASTILLO'],['4389','TADEO CARRASCOZA'],['3318','CARLOS GIOVANNI LORENZANA ESTRADA'],['4765','MAURICIO ORELLANA'],['ADMIN','ADMINISTRADOR']];let selected=null;const list=document.getElementById('list'),login=document.getElementById('login'),pinEl=document.getElementById('pin'),err=document.getElementById('err');list.innerHTML=users.map(u=>`<button class="user ${u[0]==='ADMIN'?'admin':''}" data-code="${u[0]}"><b>${u[0]}</b><span>${u[1]}</span></button>`).join('');document.querySelectorAll('.user').forEach(el=>el.onclick=()=>{selected=users.find(u=>u[0]===el.dataset.code);document.getElementById('who').textContent=selected[0]+' · '+selected[1];login.style.display='block';pinEl.value='';err.textContent='';pinEl.focus()});async function loadApp(code,pin){document.querySelector('.wrap').innerHTML='<div class="loading">Verificando usuario y conectando con la base de datos...</div>';try{const source=await fetch('app.html?cb='+Date.now(),{cache:'no-store'}).then(r=>r.text());const m=source.match(/const b="([^"]+)";/);if(!m)throw new Error('No se encontró el sistema principal.');const raw=atob(m[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();out=out.replace(/VENDEDOR_CODIGO='[^']*'/,`VENDEDOR_CODIGO='${code}'`);out=out.replace(/init\(\);/g,'');const safePin=String(pin||'').replace(/[^0-9]/g,'');out += `\n<script>async function ensureOpenWeek(){if(!vendedor?.id)throw new Error('No se encontró el vendedor autenticado.');let q=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','ABIERTA').order('fecha_inicio',{ascending:false}).limit(1).maybeSingle();if(q.error)throw q.error;if(q.data){semana=q.data;return}let w=weekFromDate(dateISO(new Date()));if(!w)throw new Error('No se pudo calcular la semana actual.');let e=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('fecha_inicio',w.inicio).eq('fecha_fin',w.fin).maybeSingle();if(e.error)throw e.error;if(e.data){let u=await db.from('semanas_liquidacion').update({estado:'ABIERTA'}).eq('id',e.data.id).select().single();if(u.error)throw u.error;semana=u.data;return}let n=await db.from('semanas_liquidacion').insert({vendedor_id:vendedor.id,fecha_inicio:w.inicio,fecha_fin:w.fin,estado:'ABIERTA'}).select().single();if(n.error)throw n.error;semana=n.data}async function loadData(){if(!vendedor?.id||!semana?.id)throw new Error('No hay una semana activa para cargar.');let [f,c,h]=await Promise.all([db.from('facturas_viaticos').select('*').eq('vendedor_id',vendedor.id).eq('semana_id',semana.id).order('fecha_factura',{ascending:false}),db.from('cobros_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('semana_id',semana.id),db.from('semanas_liquidacion').select('*').eq('vendedor_id',vendedor.id).eq('estado','CERRADA').order('fecha_inicio',{ascending:false})]);if(f.error||c.error||h.error)throw(f.error||c.error||h.error);invoices=f.data||[];cobros=c.data||[];history=h.data||[]};window.logout=async function(){try{await db.auth.signOut()}finally{sessionStorage.removeItem('liquidacion_user');location.reload()}};let adminViewingVendor=false;window.adminPage=async function(){document.getElementById('topTitle').textContent='PANEL ADMINISTRADOR';bottom.style.display='none';let r=await db.from('vendedores').select('*').order('codigo');if(r.error){content.innerHTML='<div class="notice"><b>No se pudo cargar el panel.</b><br>'+r.error.message+'</div>';return}let cards=(r.data||[]).map(function(x){return '<button class="admin-card" style="width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit" onclick="adminOpenVendor(&quot;'+x.id+'&quot;)"><b>'+x.codigo+' · '+x.nombre+'</b><div class="rowline"><span class="muted">Abrir documentos y semanas</span><b>›</b></div></button>'}).join('');content.innerHTML='<div class="admin-title"><div><h3 style="margin:0">Panel de Administrador</h3><div class="muted">Seleccione un vendedor para administrar sus documentos</div></div><button class="btn outline smallbtn" onclick="logout()">SALIR</button></div><div class="notice"><b>Acceso administrativo activo.</b><br>Puede abrir, modificar, eliminar y generar PDFs de viáticos y cobros.</div><div class="admin-grid">'+cards+'</div>'};window.adminOpenVendor=async function(id){try{let v=await db.from('vendedores').select('*').eq('id',id).single();if(v.error)throw v.error;let w=await db.from('semanas_liquidacion').select('*').eq('vendedor_id',id).order('fecha_inicio',{ascending:false});if(w.error)throw w.error;let weeks=w.data||[],active=weeks.find(function(x){return x.estado==='ABIERTA'})||weeks[0];if(!active){alert('Este vendedor todavía no tiene semanas de liquidación registradas.');return}vendedor=v.data;semana=active;adminViewingVendor=true;await loadData();bottom.style.display='flex';go('home')}catch(e){alert('No se pudo abrir la información del vendedor.\n\n'+(e.message||e))}};window.adminBack=async function(){adminViewingVendor=false;vendedor=null;semana=null;invoices=[];cobros=[];history=[];await adminPage()};let baseHome=window.home;window.home=function(){baseHome();if(adminViewingVendor)content.insertAdjacentHTML('afterbegin','<button class="btn outline" style="margin-bottom:12px" onclick="adminBack()">← VOLVER AL PANEL ADMINISTRADOR</button>')};let baseGo=window.go;window.go=function(p){baseGo(p);if(adminViewingVendor&&(p==='viaticos'||p==='cobros')){let type=p==='viaticos'?'viatico':'cobro',label=p==='viaticos'?'VIÁTICOS Y DEPRECIACIÓN':'COBROS';content.insertAdjacentHTML('beforeend','<button class="btn outline" style="width:100%;margin-top:10px" onclick="printAdminPDF(&quot;'+type+'&quot;)">🖨 ABRIR PDF PARA IMPRIMIR · '+label+'</button>')}};window.printAdminPDF=function(type){let d=pdfDoc(type);if(d){let win=window.open(d.output('bloburl'),'_blank');if(!win)alert('El navegador bloqueó la ventana del PDF. Permita las ventanas emergentes e intente nuevamente.')}};(async()=>{try{await db.auth.signOut();const a=await db.auth.signInWithPassword({email:'${code.toLowerCase()}@liquidacion.local',password:'${safePin}'});if(a.error)throw a.error;sessionStorage.setItem('liquidacion_user','${code}');await init()}catch(e){sessionStorage.removeItem('liquidacion_user');document.body.innerHTML='<div style="font-family:Arial;padding:30px;max-width:390px;margin:auto;text-align:center"><h3>No se pudo iniciar sesión</h3><p>'+String(e.message||e)+'</p><button style="padding:12px 20px" onclick="location.reload()">VOLVER</button></div>'}})();<\/script>`;document.open();document.write(out);document.close()}catch(e){sessionStorage.removeItem('liquidacion_user');document.body.innerHTML='<pre style="padding:20px">No se pudo cargar el sistema: '+e.message+'</pre>'}}async function enter(){const p=String(pinEl.value||'').replace(/\D/g,'');if(!selected)return;if(p.length!==4){err.textContent='Ingrese exactamente 4 dígitos.';return}await loadApp(selected[0],p)}document.getElementById('enter').onclick=enter;pinEl.onkeydown=e=>{if(e.key==='Enter')enter()};</script></body></html>
