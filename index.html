<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquidación Comercial</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d0f;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:390px;min-height:100vh;background:#0b0d0f;padding:22px 16px}.logo{background:#101418;border:1px solid #2b3239;border-radius:16px;padding:18px;margin-bottom:16px;text-align:center}.logo h1{font-size:19px;margin:0 0 6px}.logo p{margin:0;color:#9aa4ad;font-size:12px}.list{display:grid;gap:9px}.user{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #2b3239;border-radius:12px;background:#14181c;color:#f3f5f7;cursor:pointer;text-align:left}.user b{width:65px;text-align:center;background:#f4c38f;color:#111;border-radius:7px;padding:10px 5px}.user span{font-weight:800;font-size:13px}.login{margin-top:18px;padding:18px;background:#14181c;border:1px solid #2b3239;border-radius:14px;display:none}.login h2{font-size:16px;margin:0 0 6px}.login p{color:#9aa4ad;font-size:12px;margin:0 0 12px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #2b3239;background:#0d1114;color:#fff;font-size:20px;letter-spacing:8px;text-align:center}.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:#e7b83f;color:#111;font-weight:900;cursor:pointer}.err{color:#ef8990;font-size:12px;margin-top:8px;min-height:16px}.loading{text-align:center;padding:40px;color:#9aa4ad}</style></head><body><div class="wrap"><div class="logo"><h1>LIQUIDACIÓN COMERCIAL</h1><p>Seleccione su usuario para continuar</p></div><div class="list" id="list"></div><div class="login" id="login"><h2 id="who"></h2><p>Ingrese su contraseña de 4 dígitos</p><input id="pin" inputmode="numeric" maxlength="4" type="password" autocomplete="off"><button class="btn" id="enter">INGRESAR</button><div class="err" id="err"></div></div></div><script>const users=[['3207','NELSON MARROQUÍN','5831'],['3822','GABRIEL MARTÍNEZ','7246'],['4708','JHONNY JUNIOR CERMEÑO','3918'],['4918','JUAN LAJUJ','8462'],['4004','CESAR PAC','2175'],['4420','MOISÉS CASTILLO','6309'],['4389','TADEO CARRASCOZA','4587'],['3318','CARLOS GIOVANNI LORENZANA ESTRADA','9124'],['4765','MAURICIO ORELLANA','3760']];let selected=null;document.getElementById('list').innerHTML=users.map(u=>`<button class="user" data-code="${u[0]}"><b>${u[0]}</b><span>${u[1]}</span></button>`).join('');document.querySelectorAll('.user').forEach(el=>el.onclick=()=>{selected=users.find(u=>u[0]===el.dataset.code);document.getElementById('who').textContent=selected[0]+' · '+selected[1];document.getElementById('login').style.display='block';document.getElementById('pin').value='';document.getElementById('err').textContent='';document.getElementById('pin').focus()});async function enter(){const pin=document.getElementById('pin').value;if(!selected)return;if(selected[2]!==pin){document.getElementById('err').textContent='Contraseña incorrecta.';return}document.querySelector('.wrap').innerHTML='<div class="loading">Conectando con la base de datos...</div>';try{const source=await fetch('app.html',{cache:'no-store'}).then(r=>r.text());const m=source.match(/const b="([^"]+)";/);if(!m)throw new Error('No se encontró el sistema principal.');const raw=atob(m[1]),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let out=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();out=out.replace(/VENDEDOR_CODIGO='[^']*'/,`VENDEDOR_CODIGO='${selected[0]}'`);out=out.replace(/init\(\);/g,'');out += `\n<script>db.auth.signInWithPassword({email:'${selected[0]}@liquidacion.local',password:'${pin}'}).then(()=>init()).catch(e=>{document.body.innerHTML='<pre style="padding:20px">No se pudo autenticar: '+e.message+'</pre>'});<\/script>`;document.open();document.write(out);document.close()}catch(e){document.body.innerHTML='<pre style="padding:20px">No se pudo cargar el sistema: '+e.message+'</pre>'}}document.getElementById('enter').onclick=enter;document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')enter()};</script></body></html>
