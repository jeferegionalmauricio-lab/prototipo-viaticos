<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Liquidación Comercial - Prototipo</title>
<style>
:root{--bg:#0b0d0f;--card:#14181c;--card2:#1a2025;--line:#2b3239;--text:#f3f5f7;--muted:#9aa4ad;--yellow:#e7b83f;--yellow2:#c99a25;--green:#31c48d;--blue:#4f9cf9;--red:#ef6b73}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#080a0c,#11161a);color:var(--text)}
.app{width:100%;min-height:100vh;display:flex;justify-content:center;background:linear-gradient(145deg,#080a0c,#11161a)}
.phone{width:390px;min-height:844px;background:var(--bg);box-shadow:0 0 35px #0009;position:relative;overflow:hidden;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{height:72px;background:#101418;color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
.top .title{font-weight:800;font-size:16px}.icon{font-size:23px;cursor:pointer;color:var(--yellow)}
.screen{padding:18px 16px 95px;min-height:772px;background:transparent}
.profile{text-align:center;padding:18px 0}.avatar{width:78px;height:78px;border-radius:50%;background:var(--yellow);color:#101010;margin:auto;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;box-shadow:0 8px 30px #0008}.profile h2{margin:12px 0 5px}.muted{color:var(--muted)}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.module{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 12px;text-align:center;box-shadow:0 12px 30px #0005;cursor:pointer}.module .mi{font-size:38px;color:var(--yellow)}.module b{display:block;margin-top:8px}.module small{color:var(--muted)}
.card{background:rgba(20,24,28,.96);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 12px 35px #0004}.label{font-size:11px;color:var(--muted);letter-spacing:.4px}.value{font-weight:800;font-size:15px;margin-top:4px}.week{display:flex;justify-content:space-between;align-items:center}.total{font-size:25px;color:var(--yellow);font-weight:900}.invoice{display:flex;align-items:center;gap:9px}.datebox{width:45px;text-align:center;font-weight:800;color:var(--text)}.datebox small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.invoice-main{flex:1;min-width:0}.invoice-main b{font-size:13px}.invoice-main small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900;color:var(--text)}.dots{font-size:23px;cursor:pointer;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:13px 14px;font-weight:800;cursor:pointer;font-size:13px}.primary{background:var(--yellow);color:#111;width:100%}.secondary{background:#20262b;color:var(--text);border:1px solid var(--line)}.outline{background:var(--card2);color:var(--text);border:1px solid var(--line)}.danger{background:#211719;border:1px solid #3a3033;color:#ef8990}.row{display:flex;gap:8px}.row .btn{flex:1}
.field{margin-bottom:12px}.field label{font-size:11px;font-weight:700;display:block;margin-bottom:5px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#0d1114;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow)}.field textarea{height:75px;resize:none}
.bottom{position:absolute;bottom:0;left:0;right:0;background:#101418;color:var(--muted);height:68px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line)}.navitem{text-align:center;font-size:11px;cursor:pointer}.navitem span{display:block;font-size:22px}.navitem.active{color:var(--yellow)}
.modal{position:absolute;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:5}.modalbox{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:22px;width:100%;box-shadow:0 -15px 45px #0008}.modalbox h3{margin-top:0}.modalbox p{color:var(--muted);font-size:13px;line-height:1.5}.modal-actions{display:flex;gap:8px}.modal-actions .btn{flex:1}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#163c31;color:#55e0ad;font-size:10px;font-weight:800}.badge.open{background:#3a3017;color:#e7c85d}.history-item{display:flex;justify-content:space-between;align-items:center;gap:8px}.pdficon{color:var(--red);font-size:23px}.hidden{display:none!important}.notice{background:#211d0f;border-left:4px solid var(--yellow);color:var(--text);padding:12px;border-radius:8px;font-size:12px;margin-bottom:12px}.type-v{background:#163c31!important;color:#55e0ad!important}.type-d{background:#172d4b!important;color:#70adff!important}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.section-head b{font-size:13px}.section-head span{font-size:10px;font-weight:800;letter-spacing:.5px;padding:5px 8px;border-radius:20px}
@media(max-width:420px){.phone{width:100%;border:0}}
</style>
</head>
<body>
<div class="app"><div class="phone">
<div class="top"><div class="icon" onclick="go('home')">☰</div><div class="title" id="topTitle">LIQUIDACIÓN COMERCIAL</div><div class="icon">♢</div></div>
<div id="content" class="screen"></div>
<div class="bottom">
<div class="navitem active" onclick="go('home')"><span>⌂</span>Inicio</div>
<div class="navitem" onclick="go('viaticos')"><span>⛽</span>Viáticos</div>
<div class="navitem" onclick="go('history')"><span>▤</span>Historial</div>
</div>
</div></div>
<script>
let weekStart=new Date(2026,7,10),weekEnd=new Date(2026,7,15);
let invoices=[
{date:'10/08/2026',serie:'04EB8674',numero:'1384205439',razon:'COMBUSTIBLES ENERGETICOS DE GUATEMALA',concepto:'COMBUSTIBLE',monto:150,obs:'VIATICOS SEMANA'},
{date:'16/08/2026',serie:'EA0C39B1',numero:'1751206397',razon:'GASOLINERA NORTH WEST SAN ANGEL, S.A.',concepto:'COMBUSTIBLE',monto:450,obs:'VIATICOS SEMANA'}
];
let history=[{week:'03/08/2026 al 08/08/2026',total:780},{week:'27/07/2026 al 01/08/2026',total:450}];
let editing=-1;
const content=document.getElementById('content');
function money(n){return 'Q '+Number(n).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function weekText(){return `${String(weekStart.getDate()).padStart(2,'0')}/${String(weekStart.getMonth()+1).padStart(2,'0')}/${weekStart.getFullYear()} al ${String(weekEnd.getDate()).padStart(2,'0')}/${String(weekEnd.getMonth()+1).padStart(2,'0')}/${weekEnd.getFullYear()}`}
function go(page){document.getElementById('topTitle').textContent=page==='home'?'LIQUIDACIÓN COMERCIAL':page==='viaticos'?'VIÁTICOS':page==='history'?'HISTORIAL':'NUEVA FACTURA';if(page==='home')home();if(page==='viaticos')viaticos();if(page==='history')historyPage();if(page==='form')form();document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));if(page==='home')document.querySelectorAll('.navitem')[0].classList.add('active');if(page==='viaticos')document.querySelectorAll('.navitem')[1].classList.add('active');if(page==='history')document.querySelectorAll('.navitem')[2].classList.add('active')}
function home(){content.innerHTML=`<div class="profile"><div class="avatar">V</div><h2>Nelson Marroquín</h2><div class="muted">Ruta: <b>CENTRO</b></div><div class="muted">Código: <b>3207</b></div></div><div class="notice"><b>Semana activa:</b><br>${weekText()}</div><div class="modules"><div class="module" onclick="go('viaticos')"><div class="mi">⛽</div><b>VIÁTICOS</b><small>Registro y liquidación semanal</small></div><div class="module"><div class="mi">●</div><b>COBRO</b><small>Disponible en Etapa 2</small></div></div>`}
function viaticos(){let total=invoices.reduce((a,x)=>a+Number(x.monto),0);let totalV=invoices.filter(x=>x.obs==='VIATICOS SEMANA').reduce((a,x)=>a+Number(x.monto),0);let totalD=invoices.filter(x=>x.obs==='DEPRECIACION').reduce((a,x)=>a+Number(x.monto),0);let rows=invoices.map((x,i)=>`<div class="card invoice"><div style="width:78px;text-align:center;font-size:9px;font-weight:900;padding:7px 4px;border-radius:8px;background:${x.obs==='DEPRECIACION'?'#172d4b':'#163c31'};color:${x.obs==='DEPRECIACION'?'#70adff':'#55e0ad'}">${x.obs==='DEPRECIACION'?'DEPRECIACIÓN':'VIÁTICO'}</div><div class="datebox">${x.date.slice(0,2)}<small>${x.date.slice(3,5)==='08'?'AGO':''}</small></div><div class="invoice-main"><b>${x.serie}</b><small>${x.numero}</small><small>${x.concepto}</small></div><div class="amount">${money(x.monto)}</div><div class="dots" onclick="menu(${i})">⋮</div></div>`).join('');content.innerHTML=`<div class="card week"><div><div class="label">SEMANA DE LIQUIDACIÓN</div><div class="value">${weekText()}</div></div><div style="color:var(--yellow)">▣</div></div><div class="card"><div class="label">TOTAL GENERAL</div><div class="total">${money(total)}</div><div class="row" style="margin-top:12px"><div style="flex:1"><span class="badge">VIÁTICOS</span><b style="display:block;margin-top:5px">${money(totalV)}</b></div><div style="flex:1"><span class="badge" style="background:#172d4b;color:#70adff">DEPRECIACIÓN</span><b style="display:block;margin-top:5px">${money(totalD)}</b></div></div></div><div class="notice"><b>Clasificación:</b> cada registro se identifica visualmente como <b style="color:#55e0ad">VIÁTICO</b> o <b style="color:#70adff">DEPRECIACIÓN</b>. El PDF genera una sección independiente para cada tipo.</div><div style="font-weight:800;margin:18px 0 10px">Facturas cargadas (${invoices.length})</div>${rows||'<div class="card muted" style="text-align:center;padding:30px">No hay facturas cargadas</div>'}<button class="btn primary" onclick="editing=-1;go('form')">＋ AGREGAR FACTURA</button><div class="row" style="margin-top:10px"><button class="btn outline" onclick="generatePDF()">▧ GENERAR PDF</button><button class="btn danger" onclick="confirmDepurar()">▣ DEPURAR</button></div>`}
function form(){let x=editing>=0?invoices[editing]:{date:'',serie:'',numero:'',razon:'',concepto:'COMBUSTIBLE',monto:'',obs:'VIATICOS SEMANA'};content.innerHTML=`<div class="card"><div class="field"><label>FECHA DE FACTURA *</label><input id="fdate" value="${x.date}" placeholder="dd/mm/aaaa"></div><div class="field"><label>SERIE *</label><input id="fserie" value="${x.serie}"></div><div class="field"><label>NÚMERO *</label><input id="fnum" value="${x.numero}"></div><div class="field"><label>RAZÓN SOCIAL *</label><input id="frazon" value="${x.razon}"></div><div class="field"><label>CONCEPTO *</label><select id="fconcepto"><option>COMBUSTIBLE</option><option>HOSPEDAJE</option><option>ALIMENTACION</option></select></div><div class="field"><label>MONTO *</label><input id="fmonto" type="number" step="0.01" value="${x.monto}"></div><div class="field"><label>TIPO DE REGISTRO *</label><select id="fobs"><option value="VIATICOS SEMANA">VIATICOS SEMANA</option><option value="DEPRECIACION">DEPRECIACION</option></select></div><button class="btn primary" onclick="saveInvoice()">GUARDAR</button></div>`;document.getElementById('fconcepto').value=x.concepto;document.getElementById('fobs').value=x.obs}
function saveInvoice(){let x={date:fdate.value,serie:fserie.value,numero:fnum.value,razon:frazon.value,concepto:fconcepto.value,monto:Number(fmonto.value),obs:fobs.value};if(!x.date||!x.serie||!x.numero||!x.razon||!x.monto||!x.obs){alert('Completa los campos obligatorios.');return}if(editing>=0)invoices[editing]=x;else invoices.push(x);go('viaticos')}
function menu(i){let old=document.querySelector('.modal');if(old)old.remove();let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Factura ${invoices[i].serie}</h3><p>${invoices[i].razon}<br>${invoices[i].concepto} · ${money(invoices[i].monto)}</p><div class="modal-actions"><button class="btn outline" onclick="editing=${i};this.closest('.modal').remove();go('form')">✎ Editar</button><button class="btn danger" onclick="invoices.splice(${i},1);this.closest('.modal').remove();viaticos()">🗑 Eliminar</button></div></div>`;document.querySelector('.phone').appendChild(m)}
function confirmDepurar(){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>⚠ ¿Depurar esta semana?</h3><p>La liquidación <b>${weekText()}</b> quedará cerrada y se iniciará automáticamente la siguiente semana.</p><div class="modal-actions"><button class="btn outline" onclick="this.closest('.modal').remove()">CANCELAR</button><button class="btn danger" onclick="depurar();this.closest('.modal').remove()">CONFIRMAR</button></div></div>`;document.querySelector('.phone').appendChild(m)}
function depurar(){let total=invoices.reduce((a,x)=>a+Number(x.monto),0);history.unshift({week:weekText(),total});invoices=[];weekStart=new Date(2026,7,17);weekEnd=new Date(2026,7,22);alert('Semana cerrada. Nueva semana: 17/08/2026 al 22/08/2026');go('viaticos')}
function historyPage(){let current=history.map(h=>`<div class="card history-item"><div><b>${h.week}</b><small style="display:block;color:var(--muted);margin-top:5px">Total: ${money(h.total)}</small></div><span class="badge">CERRADA</span><span class="pdficon">▧</span></div>`).join('');content.innerHTML=`<h3>Historial de liquidaciones</h3>${current}<div class="card history-item"><div><b>17/08/2026 al 22/08/2026</b><small style="display:block;color:var(--muted)">Total: ${money(invoices.reduce((a,x)=>a+Number(x.monto),0))}</small></div><span class="badge open">ABIERTA</span></div>`}
function generatePDF(){let semana=invoices.filter(x=>x.obs==='VIATICOS SEMANA'),dep=invoices.filter(x=>x.obs==='DEPRECIACION');if(!invoices.length){alert('No hay facturas cargadas para generar el PDF.');return}let totalSemana=semana.reduce((a,x)=>a+Number(x.monto),0),totalDep=dep.reduce((a,x)=>a+Number(x.monto),0);let rows=(arr)=>arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.date}</td><td>${x.serie}</td><td>${x.numero}</td><td>${x.razon}</td><td>${x.concepto}</td><td>Q${Number(x.monto).toFixed(2)}</td></tr>`).join('');let sections='';if(semana.length)sections+=`<section><h1>LIQUIDACIÓN DE VIÁTICOS</h1><p><b>Nombre:</b> Nelson Marroquín &nbsp; <b>Ruta:</b> CENTRO &nbsp; <b>Código:</b> 3207</p><p><b>Semana:</b> ${weekText()}</p><h3>VIATICOS SEMANA</h3><table><thead><tr><th>No.</th><th>Fecha</th><th>Serie</th><th>Número</th><th>Razón Social</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>${rows(semana)}</tbody></table><h2>Total: Q${totalSemana.toFixed(2)}</h2></section>`;if(dep.length)sections+=`<section><h1>LIQUIDACIÓN DE DEPRECIACIÓN</h1><p><b>Nombre:</b> Nelson Marroquín &nbsp; <b>Ruta:</b> CENTRO &nbsp; <b>Código:</b> 3207</p><p><b>Semana:</b> ${weekText()}</p><h3>DEPRECIACION</h3><table><thead><tr><th>No.</th><th>Fecha</th><th>Serie</th><th>Número</th><th>Razón Social</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>${rows(dep)}</tbody></table><h2>Total: Q${totalDep.toFixed(2)}</h2></section>`;let w=window.open('','_blank','width=1000,height=800');w.document.write(`<!doctype html><html><head><title>Liquidación - PDF</title><style>body{font-family:Arial;margin:35px;color:#f3f5f7;background:#0b0d0f}h1{background:#101418;color:#e7b83f;padding:14px;border-left:5px solid #e7b83f}h3{color:#e7b83f;border-left:5px solid #e7b83f;padding-left:8px}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#20262b;color:#f3f5f7}th,td{border:1px solid #2b3239;padding:7px;text-align:left}td:last-child{text-align:right}h2{text-align:right;color:#e7b83f}section{page-break-after:always}button{background:#e7b83f;color:#111;border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer}@media print{button{display:none}}</style></head><body>${sections}<button onclick="window.print()">IMPRIMIR / GUARDAR COMO PDF</button></body></html>`);w.document.close()}
go('home');
</script>
</body>
</html>
